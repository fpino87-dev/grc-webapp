services:
  db:
    # New installations use 16, as DEV/CI. Existing PG17 volumes must keep 17
    # until an explicitly planned migration; never swap majors on a data dir.
    image: postgres:${POSTGRES_MAJOR:?Set POSTGRES_MAJOR to match the existing data directory}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Non esporre la porta DB in produzione

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        POSTGRES_MAJOR: ${POSTGRES_MAJOR:?Set POSTGRES_MAJOR}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./manual:/app/manual:ro
      - backupdata:/app/backups
      # Media persistenti (documenti, evidenze, loghi). DEVE essere lo stesso
      # volume montato su `celery`: gli upload passano dal backend, ma il
      # restore dei media è eseguito dal worker Celery.
      - /srv/grc/media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python /app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [default, converter]

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        POSTGRES_MAJOR: ${POSTGRES_MAJOR:?Set POSTGRES_MAJOR}
    restart: unless-stopped
    command: >
      celery -A core worker -l warning
      --concurrency ${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child 500
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backupdata:/app/backups
      # Stesso volume media del backend: necessario per il restore (lo swap
      # dell'albero media avviene in questo worker) e per i task che leggono i file.
      - /srv/grc/media:/app/media
    depends_on:
      - backend
      - redis
    networks: [default, converter]

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        POSTGRES_MAJOR: ${POSTGRES_MAJOR:?Set POSTGRES_MAJOR}
    restart: unless-stopped
    command: >
      celery -A core beat -l warning
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - redis

  # Conversione Word → PDF dei documenti (M07) per i pacchetti audit.
  # Rete interna senza uscita verso internet e nessuna porta pubblicata: lo
  # raggiungono solo backend e celery. Route Chromium, webhook e download da
  # URL disattivati (niente SSRF); LibreOffice si spegne quando è inattivo.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-routes
      - --pdfengines-disable-routes
      - --webhook-disable
      - --api-disable-download-from
      - --prometheus-disable-collect
      - --api-timeout=120s
      - --libreoffice-idle-shutdown-timeout=10m
      - --log-level=warn
    networks: [converter]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_TRACES_RATE: ${VITE_SENTRY_TRACES_RATE:-0.1}
        VITE_SENTRY_REPLAY_ENABLED: ${VITE_SENTRY_REPLAY_ENABLED:-false}
        VITE_SENTRY_REPLAY_SESSION_RATE: ${VITE_SENTRY_REPLAY_SESSION_RATE:-0.1}
        VITE_SENTRY_REPLAY_ERROR_RATE: ${VITE_SENTRY_REPLAY_ERROR_RATE:-1.0}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backupdata:

networks:
  default:
  # Rete senza gateway verso l'esterno: gotenberg non esce su internet.
  converter:
    internal: true
